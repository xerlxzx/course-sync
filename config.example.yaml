# course-sync configuration - EXAMPLE
#
# Copy this file to `config.yaml` and edit it with your own values.
# `config.yaml` is gitignored so your personal settings stay local.
#
# This tool works with ANY university that uses Moodle 3.9+.

moodle:
  # Base URL of your university's Moodle instance (no trailing slash).
  # Use the address you log into, e.g. https://moodle.example.edu
  base_url: https://your-moodle-site.edu
  # Token from: Profile → Preferences → Security keys → "Moodle mobile web service"
  # Store in .course_sync_token file (preferred) or set MOODLE_TOKEN env var.
  # A relative path is resolved against the folder holding config.yaml (the repo root).
  token_file: .course_sync_token

# Where to sync files to. Use an absolute path or ~ for your home directory.
# A relative path is resolved against the folder holding config.yaml (the repo
# root), so ".." means the folder above the repo.
# Examples:
#   /path/to/your/courses
#   ~/Documents/Moodle
output_dir: ~/Documents/Moodle

# Which courses to sync. `code` is matched as a prefix against each enrolled
# course's Moodle shortname (e.g. "COMP1010" matches "COMP1010-S1-2026").
# `folder` is the local directory name created under `output_dir`.
courses:
  - code: EXAMPLE101
    folder: EXAMPLE101
  - code: EXAMPLE202
    folder: EXAMPLE202

# Optional: log file path (default: sync.log in repo root)
log_file: sync.log

# Optional: files matching these patterns go to a _misc/ subfolder
# instead of the main section/lesson folder. Useful for templates,
# logos, and other non-lesson content.
#
# Defaults already catch: logos, poster/academic/presentation/essay/
# report templates, and Acknowledgement of Country imagery. You do
# NOT need to set this to get clean syncs.
#
# Patterns are regex applied to the filename (basename only).
# Add your own here to extend the defaults (they don't replace them):
# misc_patterns:
#   - "(?i)welcome.*image"
#   - "(?i)cover[\\s_-]?page"

# Optional: pick the right unit-guide offering when the unit-guide portal
# lists several (e.g. one per teaching period). `from_shortname` is a regex
# whose first group captures the period number in the course's shortname;
# `label` is a regex the offering's link text must match, with {n} replaced
# by that number. Without this, a portal listing several offerings for the
# same unit is treated as ambiguous and the guide is skipped with a warning.
# unit_guide_period:
#   from_shortname: '_T(\d+)_'      # e.g. UNIT1000_T2_2026 -> 2
#   label: '\bTerm\s+{n}\b'        # matches "Term 2"

# Optional: files matching these patterns are SKIPPED entirely
# (never downloaded, never recorded). Use sparingly.
# Patterns are regex applied to the filename (basename only).
# skip_patterns:
#   - "(?i)deprecated"
